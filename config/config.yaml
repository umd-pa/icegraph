# file and dir paths
io:
  default_dir: "/data/i3store/users/tstjean/data/processed/23122"
  gcd_path: ""

# frame keys (for feature extraction)
frames:
  corsika: true

  frame_keys:
    header: I3EventHeader
    mctree: I3MCTree_preMuonProp
    truth_dict: CorsikaWeightMap
    corsika_weight_map: CorsikaWeightMap

# table names in the intermediate hdf5 file
table_names:
  features: ml_suite_features
  truth: CorsikaWeightMap

data:
  # truth labels to use for training
  target_labels:
    - PrimaryEnergy

  # any non-target labels to include (not used in training), useful for plotting
  # these labels will be served to callbacks by the trainer during validation and test steps
  include_labels: []

  splits:
    weights: {train: 60, val: 20, test: 20}

  normalization:
    apply_log_scaling_x:
      # !!! must be columns present as features (see feature_extraction.feature_config.features
      []
    apply_log_scaling_y:
        # !!! must be columns present under data.target_labels or data.include_labels
      - PrimaryEnergy

training:
  seed: 2729

  # batch size controls how many samples are passed at a time for each
  # training batch (see torch_geometric.loader.DataLoader batch_size argument)
  batch_size: 2048
  num_workers: 6
  prefetch_factor: 8

  trainer_params:
    max_epochs: 100000
    num_nbrs: 16
    hidden_layers: 5
    hidden_channels: 256
    val_interval_epochs: 1
    save_interval: 50

  normalizer: ZScoreNormalizer

  strategy:
    task: RegressionStrategy
    kwargs:
      k: 2

  scheduler:
    # pass task: None for no scheduler
    task: StepLR
    step_mode: epoch
    kwargs:
      step_size: 50
      gamma: 0.5

  optimizer:
    task: Adam
    kwargs:
      lr: 0.0002
      betas: [0.9, 0.999]
      eps: 0.00000001
      weight_decay: 0.00005
      amsgrad: False

  tensorboard:
    port: 6599

# ml_suite configurations, see ml_suite docs
feature_extraction:
  # Define name of pulse series from which to extract features
  pulse_key: InIceDSTPulses

  # Define DOM and TimeWindow exclusions. Leave empty if no exclusions
  dom_exclusions:
    exclusions:
      - SaturationWindows
      - BadDomsList
      - CalibrationErrata
    partial_exclusion: true

  # Define pulse modifier to use. Leave empty if pulses are not modified
  pulse_modifier:
    class: ChargeWeightedMeanTimePulseModifier
    kwargs: {}

  # Define configuration for FeatureExtractor
  # (This gets passed on to FeatureExtractorFactory)
  feature_config:

    # Define list of features
    features:
      - class: TotalCharge
        kwargs: {}
      - class: TFirstPulse
        kwargs: {}
      - class: ChargeUntilT
        kwargs:
          times: [10, 50, 100]
      - class: TSpread
      - class: TimeAtChargePercentile
        kwargs:
          percentiles: [0.01, 0.03, 0.05, 0.11, 0.15, 0.2, 0.5, 0.71, 0.8]
